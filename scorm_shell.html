<!DOCTYPE html>
<html lang="en">
	<head>
		<script type="text/javascript" src="SCORM_API_wrapper.js"></script>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
	-webkit-touch-callout: none; 
	-webkit-user-select: none;
	user-select: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* --- THE FIX: DOMINANT LOGO LAYOUT --- */

#status {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	align-items: center; 
	justify-content: flex-start; /* Anchor content to top */
	visibility: hidden;
	z-index: 10;
}

#status-splash {
	position: relative; 
	/* TAKES 40% OF SCREEN WIDTH */
	width: 40vw; 
	/* LIMITS HEIGHT TO 40% OF SCREEN */
	max-height: 40vh; 
	margin-top: 15vh; 
	margin-bottom: 30px; 
	object-fit: contain; 
}

#status-progress {
	position: relative; 
	width: 50%;
	height: 12px;
	border: 1px solid #444;
	border-radius: 10px;
}

/* Progress bar styling */
#status-progress::-webkit-progress-bar { background-color: #222; border-radius: 10px; }
#status-progress::-webkit-progress-value { background-color: #125b71; border-radius: 10px; }

/* --- END OF LAYOUT FIXES --- */

#status-splash.show-image--false {
	display: none;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body oncontextmenu="return false;">
		<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault(); return false;">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	// Initialize SCORM Session
	if (typeof pipwerks !== 'undefined') {
		// scripts/core/lms.gd writes SCORM 1.2 element names (cmi.core.*).
		// Left to auto-detect, the wrapper prefers API_1484_11 over API
		// whenever an LMS exposes both, and every one of those writes would
		// then fail silently against the 2004 data model. Pin the version so
		// the wrapper looks for the 1.2 API and nothing else.
		pipwerks.SCORM.version = '1.2';

		// The debrief, the fail screen and the pause menu each set
		// cmi.core.exit deliberately before quitting. The wrapper caches an
		// exit status only when it is read by get(), never when it is set(),
		// so on terminate() it believes no exit was chosen and overwrites
		// ours - turning a finished failed attempt into "suspend", which
		// resumes the trainee into a spent run instead of a clean retry.
		pipwerks.SCORM.handleExitMode = false;

		pipwerks.SCORM.init();

		// SCORM 1.2 never measures the attempt for you: cmi.core.session_time
		// is write-only, and the LMS folds whatever the SCO reports into
		// cmi.core.total_time at LMSFinish. Report nothing and the attempt goes
		// on record as zero minutes long - for an RTO that is missing evidence
		// of participation, not a cosmetic gap. SCORM Cloud papers over it by
		// timing the connection itself, which is why the debug log there looked
		// right while nothing was being sent.
		//
		// The clock belongs to the shell rather than to the engine because the
		// session starts at LMSInitialize, before the engine boots, and because
		// a closed tab has to report a duration too - and that is the one exit
		// the engine never sees.
		var sessionStart = Date.now();
		var sessionEnded = false;

		// HHHH:MM:SS.SS - the CMITimespan the 1.2 data model asks for, not the
		// ISO 8601 duration its 2004 replacement takes. Hundredths, because the
		// format carries them and rounding up to whole seconds on every attempt
		// would quietly inflate total_time.
		function sessionTime() {
			var cs = Math.max(0, Math.round((Date.now() - sessionStart) / 10));
			var pad = function (n, width) { return String(n).padStart(width, '0'); };
			return pad(Math.floor(cs / 360000), 4) + ':'
				+ pad(Math.floor(cs / 6000) % 60, 2) + ':'
				+ pad(Math.floor(cs / 100) % 60, 2) + '.'
				+ pad(cs % 100, 2);
		}

		// Every way out funnels through here. The debrief, the fail screen and
		// the pause menu arrive via Lms.quit_session(); a closed tab arrives
		// via beforeunload. Guarded because both can happen in one session -
		// the trainee presses Exit and then closes the page - and the second
		// LMSFinish would be an error raised against an already dead session.
		window.lvrScormFinish = function () {
			if (sessionEnded) { return; }
			sessionEnded = true;
			pipwerks.SCORM.set('cmi.core.session_time', sessionTime());
			pipwerks.SCORM.quit();
		};

		// Ensure SCORM quits if user closes browser window or navigates away
		window.addEventListener('beforeunload', function() {
			window.lvrScormFinish();
		});
	}

	// Hard-block Context Menu (Capture Phase)
	document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	const canvas = document.getElementById('canvas');
	// Ensure canvas is focused on any click to fix Mac/Edge issues
	window.addEventListener('mousedown', function() {
		canvas.focus();
	});

	// Who let go of the pointer lock. The engine releases it itself all the
	// time - the CPR camera, the AED, every blocking card - and always through
	// document.exitPointerLock(). The browser releases it without calling
	// that: Escape, alt-tab, a click outside the frame. Only the second kind is
	// the trainee stepping away, so only that one tells the game, which pauses
	// (scripts/ui/pause_menu.gd). Looked up at call time rather than bound
	// here, so nothing that replaces the prototype's version is bypassed.
	(function () {
		let engineReleasing = false;
		document.exitPointerLock = function () {
			if (document.pointerLockElement) engineReleasing = true;
			return Document.prototype.exitPointerLock.call(document);
		};
		document.addEventListener('pointerlockchange', function () {
			if (document.pointerLockElement) {
				engineReleasing = false;
				return;
			}
			const forced = !engineReleasing;
			engineReleasing = false;
			if (forced && typeof window.lvrOnLockLost === 'function') {
				window.lvrOnLockLost();
			}
		});
	})();

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		if (err instanceof Error) setStatusNotice(err.message);
		else if (typeof err === 'string') setStatusNotice(err);
		else setStatusNotice('An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			navigator.serviceWorker.getRegistration().then((reg) => {
				if (reg == null) return engine.installServiceWorker();
			}).then(() => window.location.reload());
		} else {
			displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				}
			},
		}).then(() => { setStatusMode('hidden'); }, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
